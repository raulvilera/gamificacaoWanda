","aulasGuia":[11],"imagemAlt":"Ilustração abstrata de Ciências — Tratamento da água e saneamento básico"},{"pergunta":"Pegada ecológica é um indicador que relaciona:","alternativas":["O impacto do consumo humano à capacidade de regeneração dos recursos","A idade de uma rocha","A velocidade do vento","O número de planetas"],"gabarito":0,"habilidade":"EF09CI12B","imagem":"quiz_9_08.svg","tema":"Pegada ecológica e consumo responsável","componente":"Ciências","bimestre":"3º Bimestre","anoSerie":"9º ano","aulasGuia":[15],"imagemAlt":"Ilustração abstrata de Ciências — Pegada ecológica e consumo responsável"},{"pergunta":"Na economia circular, materiais e produtos são planejados para:","alternativas":["Ser reparados, reutilizados e reciclados, reduzindo desperdícios","Ser descartados após um único uso","Aumentar a extração de recursos","Impedir a logística reversa"],"gabarito":0,"habilidade":"EF09CI12B","imagem":"quiz_9_09.svg","tema":"Economia circular e desenvolvimento sustentável","componente":"Ciências","bimestre":"3º Bimestre","anoSerie":"9º ano","aulasGuia":[16],"imagemAlt":"Ilustração abstrata de Ciências — Economia circular e desenvolvimento sustentável"},{"pergunta":"A coleta seletiva e a logística reversa ajudam a:","alternativas":["Encaminhar resíduos corretamente e recuperar materiais após o consumo","Misturar todos os resíduos","Aumentar o volume de lixões","Eliminar a responsabilidade de fabricantes e consumidores"],"gabarito":0,"habilidade":"EF09CI13","imagem":"quiz_9_10.svg","tema":"Coleta seletiva e reciclagem de materiais","componente":"Ciências","bimestre":"3º Bimestre","anoSerie":"9º ano","aulasGuia":[18],"imagemAlt":"Ilustração abstrata de Ciências — Coleta seletiva e reciclagem de materiais"}],"anoSerie":"9º ano","componente":"Ciências","bimestre":"3º Bimestre","guiaCurricular":"Guia Priorizado de Ciências · CIE_AF_2026"}}</script>
<script>
const DADOS=JSON.parse(document.getElementById('dados-turmas').textContent), LETRAS=['A','B','C','D'];
const CONFIG_CURRICULAR={componente:'Ciências',bimestre:'3º Bimestre'};
function validarTrilha(slug,dados){const match=slug.match(/^(\d)oAno/);const ano=match?match[1]:'';const prefix='EF0'+ano+'CI';if(!dados||dados.componente!==CONFIG_CURRICULAR.componente||dados.bimestre!==CONFIG_CURRICULAR.bimestre||dados.anoSerie!==ano+'º ano'||dados.questoes.some(q=>q.componente!==CONFIG_CURRICULAR.componente||q.bimestre!==CONFIG_CURRICULAR.bimestre||q.anoSerie!==ano+'º ano'||!q.habilidade.startsWith(prefix)||!Array.isArray(q.aulasGuia)||q.aulasGuia.length===0)){throw new Error('Trilha curricular inválida para '+slug)}return dados.questoes}
const WEBAPP_URL='https://script.google.com/macros/s/AKfycbxpY_PUQdDl4_4P86xDcnNwvTY19-mokhueqlFUAcOl_FKMeJUwLIoB8WOU88WO-iw/exec';
let turmaAtual='', alunoAtual='', questoes=[], indice=0, respostas=[], pontuacao=0, streak=0, streakMax=0, acertos=0, tempo=600, timer=null, finalizado=false;
const app=document.getElementById('app'); const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),900)}
function formatTime(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function renderSelecao(){clearInterval(timer); document.title='NEBULA // Ciências'; app.innerHTML=`<section class="hero"><div class="eyebrow">MISSÃO 03 · 2026 · CIÊNCIAS</div><h1>Operação <span>Nebula</span></h1><p>Desbloqueie os conhecimentos do 3º bimestre. Uma missão individual, com 10 desafios e pontuação por combo.</p></section><section class="selection-card"><div class="selection-title">Iniciar protocolo de aprendizagem</div><p class="selection-copy">Selecione sua turma e seu nome. A lista de estudantes continua disponível em formato dropdown, agora com uma jornada individual.</p><div class="select-grid"><div class="field"><label for="turma">01 // Turma</label><select id="turma"><option value="">Escolha seu ano e turma...</option>${Object.entries(DADOS).map(([k,d])=>`<option value="${k}">${esc(d.nomeTurma)}</option>`).join('')}</select></div><div class="field"><label for="aluno">02 // Agente</label><select id="aluno" disabled><option value="">Selecione a turma primeiro...</option></select></div></div><button id="launch" class="launch" disabled>INICIAR MISSÃO INDIVIDUAL</button><div class="pills"><span class="pill"><b>10</b> desafios</span><span class="pill"><b>10:00</b> minutos</span><span class="pill"><b>+20</b> combo máximo</span><span class="pill"><b>3º</b> bimestre</span></div></section>`;
const st=document.getElementById('turma'), sa=document.getElementById('aluno'), btn=document.getElementById('launch'); st.onchange=()=>{const d=DADOS[st.value];sa.innerHTML=d?'<option value="">Escolha seu nome...</option>'+d.alunos.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join(''):'<option value="">Selecione a turma primeiro...</option>';sa.disabled=!d;btn.disabled=true}; sa.onchange=()=>btn.disabled=!(st.value&&sa.value!==''); btn.onclick=()=>startMission(st.value, DADOS[st.value].alunos[Number(sa.value)]);
}
function startMission(slug,nome){turmaAtual=slug;alunoAtual=nome;const dados=DADOS[slug];try{questoes=validarTrilha(slug,dados)}catch(err){app.innerHTML='<section class="result-card"><div class="result-orb">⚠</div><h2>Trilha curricular indisponível</h2><p class="result-line">A turma selecionada não possui questões válidas de Ciências do 3º bimestre para sua série.</p><button class="ghost-btn" onclick="renderSelecao()">VOLTAR</button></section>';return}indice=0;respostas=[];pontuacao=0;streak=0;streakMax=0;acertos=0;tempo=600;finalizado=false;renderGame();timer=setInterval(()=>{tempo--;updateTimer();if(tempo<=0)finish(true)},1000)}
function renderGame(){const d=DADOS[turmaAtual],q=questoes[indice];app.innerHTML=`<section class="game-shell"><div class="statusbar"><div class="player">AGENTE <strong>${esc(alunoAtual)}</strong> · ${esc(d.nomeTurma)}</div><div class="status-stats"><span class="stat-chip">SCORE <b id="score">${pontuacao}</b></span><span class="stat-chip">COMBO <b id="combo">${streak}</b></span><span class="stat-chip timer" id="timer">${formatTime(tempo)}</span></div></div><div class="progress-wrap"><div class="progress-bar" id="progress" style="width:${(indice/questoes.length)*100}%"></div></div><div class="quest-wrap"><div class="mission">DESAFIO ${String(indice+1).padStart(2,'0')} / ${questoes.length} · ${esc(q.habilidade)}</div><div class="curriculum-line">${esc(d.componente)} · ${esc(d.bimestre)} · ${esc(d.anoSerie)}</div><span class="theme-tag">${esc(q.tema)}</span><h2 class="question-title">${esc(q.pergunta)}</h2>${q.imagem?`<img class="question-media" src="imagens/${esc(q.imagem)}" alt="${esc(q.imagemAlt||('Ilustração científica: '+q.tema))}">`:''}<div class="answers">${q.alternativas.map((a,i)=>`<button class="answer" data-index="${i}"><span class="letter">${LETRAS[i]}</span><span>${esc(a)}</span></button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="next-row"><span class="progress-copy">Cada acerto gera pontos. Sequências elevam seu multiplicador.</span><button id="next" class="next-btn" disabled>${indice===questoes.length-1?'FINALIZAR MISSÃO':'PRÓXIMO DESAFIO →'}</button></div></div></section>`;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(Number(b.dataset.index)));document.getElementById('next').onclick=()=>{if(indice===questoes.length-1)finish(false);else{indice++;renderGame()}}}
function answer(escolha){if(respostas[indice]!==undefined)return;const q=questoes[indice],ok=escolha===q.gabarito;respostas[indice]=escolha;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.gabarito)b.classList.add('correct');if(i===escolha&&!ok)b.classList.add('wrong')});if(ok){streak++;streakMax=Math.max(streakMax,streak);acertos++;const pts=10+(streak>=3?5:0)+(streak>=5?5:0);pontuacao+=pts;toast('+'+pts+' XP');showFeedback(true,'Resposta correta. Combo '+streak+' ativo — você ganhou '+pts+' XP.')}else{streak=0;showFeedback(false,'Resposta incorreta. A alternativa correta foi destacada para você revisar.')}document.getElementById('score').textContent=pontuacao;document.getElementById('combo').textContent=streak;document.getElementById('next').disabled=false;document.getElementById('progress').style.width=((indice+1)/questoes.length*100)+'%'}
function showFeedback(ok,msg){const el=document.getElementById('feedback');el.className='feedback show '+(ok?'good':'bad');el.textContent=(ok?'✓ ':'× ')+msg}
function updateTimer(){const el=document.getElementById('timer');if(el)el.textContent=formatTime(tempo)}
function finish(tempoEsgotado){if(finalizado)return;finalizado=true;clearInterval(timer);const total=questoes.length,pct=Math.round(acertos/total*100);const key='ranking_'+turmaAtual, ranking=JSON.parse(localStorage.getItem(key)||'[]');ranking.push({aluno:alunoAtual,pontos:pontuacao,acertos,total,tempo:600-tempo,data:new Date().toISOString()});ranking.sort((a,b)=>b.pontos-a.pontos);localStorage.setItem(key,JSON.stringify(ranking.slice(0,30)));app.innerHTML=`<section class="result-card"><div class="result-orb">${pct>=80?'✦':pct>=50?'◈':'◇'}</div><div class="eyebrow">MISSÃO ENCERRADA</div><h2>${tempoEsgotado?'Tempo esgotado':'Protocolo concluído'}, ${esc(alunoAtual.split(' ')[0])}.</h2><div class="score">${pontuacao}</div><div class="result-line">XP acumulado · ${acertos}/${total} acertos · ${pct}% de precisão</div><div class="result-grid"><div class="result-stat"><b>${acertos}</b><span>ACERTOS</span></div><div class="result-stat"><b>${streakMax}</b><span>MELHOR COMBO</span></div><div class="result-stat"><b>${formatTime(600-tempo)}</b><span>TEMPO USADO</span></div></div><button class="launch" id="send">ENVIAR RESULTADO AO PAINEL</button><button class="ghost-btn" style="margin-top:12px" id="again">NOVA MISSÃO</button><div class="submit-status" id="sendStatus"></div></section>`;document.getElementById('again').onclick=renderSelecao;document.getElementById('send').onclick=sendResult}
async function sendResult(){const btn=document.getElementById('send'),st=document.getElementById('sendStatus');btn.disabled=true;btn.textContent='TRANSMITINDO...';try{await fetch(WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({turma:turmaAtual,alunoNome:alunoAtual,pontuacao,acertos,total:questoes.length,streakMax,tempoUsado:600-tempo,respostas,habilidades:questoes.map((q,i)=>({hab:q.habilidade,acerto:respostas[i]===q.gabarito}))})});st.textContent='✓ Resultado enviado. O ranking individual já está atualizado.';btn.textContent='TRANSMITIDO ✓'}catch(e){st.textContent='Não foi possível transmitir agora. O resultado ficou salvo neste dispositivo.';btn.disabled=false;btn.textContent='TENTAR NOVAMENTE'}}
renderSelecao();
</script>
</body></html>

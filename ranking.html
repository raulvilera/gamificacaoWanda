<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="refresh" content="10"><title>NEBULA // Ranking</title><style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Orbitron:wght@600;800&display=swap');:root{--bg:#050712;--cyan:#7df9ff;--pink:#ff4ecd;--text:#ecf7ff;--muted:#8fa4be}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:34px 20px;color:var(--text);font-family:'Space Grotesk',sans-serif;background:radial-gradient(circle at 15% 10%,#1a1850,transparent 30%),radial-gradient(circle at 85% 75%,#3b123b,transparent 30%),#050712;background-image:linear-gradient(rgba(125,249,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(125,249,255,.035) 1px,transparent 1px);background-size:40px 40px;text-align:center}.brand{font:800 18px Orbitron;letter-spacing:.18em;color:var(--cyan)}h1{font:800 clamp(32px,6vw,64px) Orbitron;margin:28px 0 8px;text-shadow:0 0 22px #7df9ff55}.sub{color:var(--muted);margin-bottom:32px}.controls{display:flex;justify-content:center;gap:10px;margin-bottom:28px}.controls select{background:#0a1126;color:var(--text);border:1px solid #7df9ff44;border-radius:10px;padding:12px 14px}.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 auto 30px;max-width:850px}.podium-item,.table-wrap{background:#0d142bd9;border:1px solid #7df9ff33;border-radius:18px;box-shadow:0 18px 50px #0006}.podium-item{min-width:160px;padding:20px 16px}.gold{border-color:#ffe879!important}.silver{border-color:#c8d8e7!important}.bronze{border-color:#cf916c!important}.medal{font-size:40px}.podium-name{font-weight:700;margin:8px 0}.points{font:800 24px Orbitron;color:var(--cyan)}.label{color:var(--muted);font-size:12px;margin-top:5px}.table-wrap{max-width:850px;margin:auto;overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left}.table th{color:var(--cyan);font:600 11px Orbitron;letter-spacing:.1em;padding:16px;border-bottom:1px solid #7df9ff22}.table td{padding:14px 16px;border-bottom:1px solid #ffffff0c}.table td:last-child{color:var(--pink);font:700 15px Orbitron}.live{color:#b5ff75;font-size:12px;margin-top:22px}a{color:var(--cyan)}</style></head><body><div class="brand">NEBULA // C.I.E.</div><h1>RANKING <span style="color:var(--pink)">INDIVIDUAL</span></h1><p class="sub">Central de Inteligência Escolar · atualiza automaticamente a cada 10 segundos</p><div class="controls"><select id="turma"></select><a href="index.html" style="padding:12px 14px">← Nova missão</a></div><div id="podium" class="podium"></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Agente</th><th>Acertos</th><th>XP</th></tr></thead><tbody id="body"></tbody></table></div><p class="live">● PAINEL AO VIVO · E.E. Profª Wanda Mascagni de Sá</p><script>const TURMAS={"6oAno_A":"6ºAno A","6oAno_C":"6ºAno C","7oAno_A":"7ºAno A","7oAno_B":"7ºAno B","8oAno_A":"8ºAno A","8oAno_B":"8ºAno B","9oAno_A":"9ºAno A","9oAno_B":"9ºAno B"};const sel=document.getElementById('turma');Object.entries(TURMAS).forEach(([k,n])=>sel.innerHTML+=`<option value="${k}">${n}</option>`);const param=new URLSearchParams(location.search).get('turma');if(param&&TURMAS[param])sel.value=param;sel.onchange=()=>{history.replaceState({},'',`?turma=${sel.value}`);load()};function load(){const ds=JSON.parse(localStorage.getItem('ranking_'+sel.value)||'[]');document.getElementById('podium').innerHTML=ds.slice(0,3).map((d,i)=>`<div class="podium-item ${['gold','silver','bronze'][i]}"><div class="medal">${['✦','◆','◇'][i]}</div><div class="podium-name">${d.aluno}</div><div class="points">${d.pontos} XP</div><div class="label">${d.acertos}/${d.total} acertos</div></div>`).join('')||'<div class="sub">Nenhuma missão registrada nesta turma.</div>';document.getElementById('body').innerHTML=ds.map((d,i)=>`<tr><td>${i+1}</td><td>${d.aluno}</td><td>${d.acertos}/${d.total}</td><td>${d.pontos}</td></tr>`).join('')}load();setInterval(load,5000);</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="10">
<title>🏆 Ranking — Quiz das Duplas</title>
<style>
:root{--azul-900:#0f2a4d;--azul-700:#1a3c6e;--azul-500:#2f5aa8;--dourado:#ffd700;--prata:#c0c0c0;--bronze:#cd7f32;--cinza-100:#f4f6f9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Inter,system-ui,sans-serif;background:linear-gradient(135deg,var(--azul-900),#0a1a30);color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px;}
.titulo-principal{font-size:42px;font-weight:900;text-align:center;margin-bottom:8px;text-shadow:0 4px 20px rgba(0,0,0,.3);}
.subtitulo{font-size:16px;opacity:.7;text-align:center;margin-bottom:40px;}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:20px;margin-bottom:40px;}
.podium-item{text-align:center;padding:20px;border-radius:16px;background:rgba(255,255,255,.08);backdrop-filter:blur(10px);min-width:160px;transition:transform .3s;}
.podium-item:hover{transform:translateY(-8px);}
.podium-item.gold{border:2px solid var(--dourado);box-shadow:0 0 30px rgba(255,215,0,.2);}
.podium-item.silver{border:2px solid var(--prata);box-shadow:0 0 30px rgba(192,192,192,.15);}
.podium-item.bronze{border:2px solid var(--bronze);box-shadow:0 0 30px rgba(205,127,50,.15);}
.podium-rank{font-size:48px;margin-bottom:4px;}
.podium-nome{font-size:15px;font-weight:700;margin-bottom:4px;}
.podium-pontos{font-size:28px;font-weight:900;color:var(--dourado);}
.podium-label{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.05em;}
.podium-item.gold .podium-rank{color:var(--dourado);}
.podium-item.silver .podium-rank{color:var(--prata);}
.podium-item.bronze .podium-rank{color:var(--bronze);}
.tabela-ranking{width:100%;max-width:700px;background:rgba(255,255,255,.06);border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.tabela-ranking th{background:rgba(255,255,255,.1);padding:14px 16px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;text-align:left;}
.tabela-ranking td{padding:12px 16px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05);}
.tabela-ranking tr:hover{background:rgba(255,255,255,.04);}
.tabela-ranking .pos{width:50px;font-weight:800;text-align:center;}
.tabela-ranking .pts{font-weight:900;color:var(--dourado);text-align:right;}
.tabela-ranking .acertos{text-align:center;opacity:.7;font-size:12px;}
.atualizacao{text-align:center;margin-top:30px;font-size:12px;opacity:.5;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.live-dot{display:inline-block;width:8px;height:8px;background:#4caf50;border-radius:50%;margin-right:6px;animation:pulse 1.5s infinite;}
</style>
</head>
<body>
  <div style="text-align:center;margin-bottom:10px;"><span class="live-dot"></span><span style="font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.1em;">Ranking ao vivo</span></div>
  <h1 class="titulo-principal">🏆 Quiz das Duplas</h1>
  <p class="subtitulo" id="subTitulo">Carregando ranking...</p>

  <div class="podium" id="podium"></div>

  <table class="tabela-ranking" id="tabela">
    <thead><tr><th class="pos">#</th><th>Dupla</th><th class="acertos">Acertos</th><th class="pts">Pontos</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="atualizacao">Atualiza automaticamente a cada 10 segundos · E.E. Profª Wanda Mascagni de Sá</p>

<script>
const TURMA = new URLSearchParams(window.location.search).get('turma')||'6oAno_A';

function carregarRanking(){
  const dados = JSON.parse(localStorage.getItem('ranking_'+TURMA)||'[]');
  document.getElementById('subTitulo').textContent = 'Ranking — '+TURMA.replace(/_/g,' ').replace(/o/g,'º');

  const podium = document.getElementById('podium');
  const tbody = document.getElementById('tbody');

  if(dados.length===0){
    podium.innerHTML = '<div style="opacity:.5;font-size:18px;">Nenhuma dupla jogou ainda</div>';
    tbody.innerHTML = '';
    return;
  }

  // Podium (top 3)
  const emojis = ['🥇','🥈','🥉'];
  const classes = ['gold','silver','bronze'];
  podium.innerHTML = dados.slice(0,3).map((d,i)=>{
    return '<div class="podium-item '+classes[i]+'">'+
      '<div class="podium-rank">'+emojis[i]+'</div>'+
      '<div class="podium-nome">'+d.dupla+'</div>'+
      '<div class="podium-pontos">'+d.pontos+' pts</div>'+
      '<div class="podium-label">'+d.acertos+'/'+d.total+' acertos</div>'+
    '</div>';
  }).join('');

  // Tabela
  tbody.innerHTML = dados.map((d,i)=>{
    return '<tr><td class="pos">'+(i+1)+'</td><td>'+d.dupla+'</td><td class="acertos">'+d.acertos+'/'+d.total+'</td><td class="pts">'+d.pontos+'</td></tr>';
  }).join('');
}

carregarRanking();
setInterval(carregarRanking,5000);
</script>
</body>
</html>
